<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="多源采集、可选审核、格式路由与完整发布流程图">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#031023"/><stop offset="1" stop-color="#0a203d"/></linearGradient><filter id="g"><feDropShadow stdDeviation="9" flood-color="#4bd6ff" flood-opacity=".22"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" viewBox="0 0 14 14" orient="auto"><path d="M0 0 14 7 0 14Z" fill="#55d9ff"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" viewBox="0 0 14 14" orient="auto"><path d="M0 0 14 7 0 14Z" fill="#a77aff"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" viewBox="0 0 14 14" orient="auto"><path d="M0 0 14 7 0 14Z" fill="#ffad4d"/></marker><style>.cn{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.t{font-size:42px;font-weight:800;fill:#f8fbff}.s{font-size:22px;fill:#96cbed}.h{font-size:22px;font-weight:750;fill:#55d9ff}.hp{font-size:22px;font-weight:750;fill:#d5bdff}.b{font-size:18px;fill:#dfebf7}.sm{font-size:16px;fill:#a9bfd4}.tag{font-size:15px;font-weight:700;fill:#e6f3fc}.card{fill:#082743;stroke:#29c4f5;stroke-width:2}.pcard{fill:#17183d;stroke:#956af0;stroke-width:2.5}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="78" text-anchor="middle" class="cn t">多源数据采集与可信入库流程</text><text x="800" y="118" text-anchor="middle" class="cn s">采集任务按需审核，所有任务统一解析并完整发布</text>

<!-- Sources -->
<g class="cn"><text x="125" y="163" text-anchor="middle" class="h">数据来源</text>
<rect x="35" y="195" width="180" height="85" rx="16" class="card"/><text x="125" y="230" text-anchor="middle" class="b">结构化 API</text><text x="125" y="256" text-anchor="middle" class="sm">CVE · CWE · KEV</text>
<rect x="35" y="325" width="180" height="85" rx="16" class="card"/><text x="125" y="360" text-anchor="middle" class="b">网页与站点</text><text x="125" y="386" text-anchor="middle" class="sm">URL · 关键词 · 站点</text>
<rect x="35" y="530" width="180" height="85" rx="16" class="card"/><text x="125" y="565" text-anchor="middle" class="b">本地文件</text><text x="125" y="591" text-anchor="middle" class="sm" style="font-size:14px">PDF · DOCX · TXT · 图片</text></g>

<!-- Collection adapters -->
<g class="cn"><text x="330" y="163" text-anchor="middle" class="h">采集处理</text>
<rect x="240" y="195" width="180" height="85" rx="16" class="card"/><text x="330" y="230" text-anchor="middle" class="b">结构化适配</text><text x="330" y="256" text-anchor="middle" class="sm">字段规范化</text>
<rect x="240" y="325" width="180" height="85" rx="16" class="card"/><text x="330" y="360" text-anchor="middle" class="b">抓取与清洗</text><text x="330" y="386" text-anchor="middle" class="sm">确定性内容清洗</text>
<path d="M215 237H240" fill="none" stroke="#55d9ff" stroke-width="4" marker-end="url(#a)"/><path d="M215 367H240" fill="none" stroke="#55d9ff" stroke-width="4" marker-end="url(#a)"/></g>

<!-- Review decision -->
<path d="M420 237H450M420 367H450M450 237V367M450 300H470" fill="none" stroke="#55d9ff" stroke-width="4"/>
<path d="M515 255L560 300L515 345L470 300Z" fill="#20204d" stroke="#a479f7" stroke-width="3"/><text x="515" y="294" text-anchor="middle" class="cn tag">启用</text><text x="515" y="316" text-anchor="middle" class="cn tag">审核？</text>
<path d="M560 300H625Q645 300 645 320M645 320V700" fill="none" stroke="#55d9ff" stroke-width="4"/><text x="602" y="286" text-anchor="middle" class="cn sm">否</text>
<path d="M645 420H665" fill="none" stroke="#55d9ff" stroke-width="4" marker-end="url(#a)"/>
<path d="M515 345V400" fill="none" stroke="#a77aff" stroke-width="4" marker-end="url(#p)"/><text x="532" y="374" class="cn sm">是</text>
<g class="cn"><rect x="430" y="400" width="170" height="95" rx="17" class="pcard"/><text x="515" y="435" text-anchor="middle" class="hp">Agent 审核</text><text x="515" y="465" text-anchor="middle" class="sm">批准 / 拒绝 / 转人工</text>
<path d="M600 432H645" fill="none" stroke="#a77aff" stroke-width="4"/><text x="622" y="418" text-anchor="middle" class="cn sm">批准</text>
<path d="M515 495V525" fill="none" stroke="#a77aff" stroke-width="4" marker-end="url(#p)"/><text x="534" y="516" class="cn sm">复核</text>
<rect x="430" y="525" width="170" height="65" rx="16" class="pcard"/><text x="515" y="553" text-anchor="middle" class="hp" font-size="20">人工复核</text><text x="515" y="577" text-anchor="middle" class="sm">低置信度 / 审核失败</text>
<path d="M600 550H645" fill="none" stroke="#a77aff" stroke-width="4"/><text x="622" y="536" text-anchor="middle" class="cn sm">批准</text>
<path d="M430 470H405V643H415" fill="none" stroke="#ffad4d" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#o)"/>
<path d="M515 590V620" fill="none" stroke="#ffad4d" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#o)"/>
<rect x="415" y="620" width="200" height="46" rx="14" fill="#3a271d" stroke="#ffad4d"/><text x="515" y="649" text-anchor="middle" class="tag" fill="#ffc46d">记录拒绝并清理暂存</text></g>

<!-- Unified queue: crawler accepted + direct upload -->
<g class="cn" filter="url(#g)"><rect x="665" y="350" width="185" height="140" rx="21" class="card"/><text x="757" y="395" text-anchor="middle" class="h">可靠入库任务</text><text x="757" y="432" text-anchor="middle" class="tag">Transactional Outbox</text><text x="757" y="463" text-anchor="middle" class="sm">RabbitMQ → Worker</text></g>
<path d="M215 572H230V700H645" fill="none" stroke="#55d9ff" stroke-width="4"/><text x="410" y="687" text-anchor="middle" class="cn sm">文件上传直接进入入库任务</text>

<!-- Format routing -->
<path d="M850 420H900" fill="none" stroke="#55d9ff" stroke-width="5" marker-end="url(#a)"/>
<path d="M945 375L990 420L945 465L900 420Z" fill="#123c61" stroke="#66d9fb" stroke-width="3"/><text x="945" y="414" text-anchor="middle" class="cn tag">格式</text><text x="945" y="436" text-anchor="middle" class="cn tag">路由</text>
<path d="M990 420H1015M1015 235V605M1015 235H1040M1015 420H1040M1015 605H1040" fill="none" stroke="#55d9ff" stroke-width="4"/>

<!-- Parser branches -->
<g class="cn">
 <rect x="1040" y="185" width="190" height="100" rx="17" class="pcard"/><text x="1135" y="225" text-anchor="middle" class="hp">MinerU</text><text x="1135" y="255" text-anchor="middle" class="sm">PDF / DOCX</text>
 <rect x="1040" y="370" width="190" height="100" rx="17" class="card"/><text x="1135" y="410" text-anchor="middle" class="h">文本解析</text><text x="1135" y="440" text-anchor="middle" class="sm">TXT / MD / CSV / HTML</text>
 <rect x="1040" y="555" width="190" height="100" rx="17" class="pcard"/><text x="1135" y="595" text-anchor="middle" class="hp">图片 OCR</text><text x="1135" y="625" text-anchor="middle" class="sm">本地 PDF 解析回退</text>
</g>

<!-- Parser merge -->
<path d="M1230 235H1255M1230 420H1255M1230 605H1255M1255 235V605M1255 420H1262" fill="none" stroke="#55d9ff" stroke-width="4"/>
<circle cx="1290" cy="420" r="28" fill="#173e66" stroke="#72ddff" stroke-width="3"/><path d="M1277 407L1290 420L1277 433M1290 420H1303" fill="none" stroke="#c5f2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1318 420H1350" fill="none" stroke="#55d9ff" stroke-width="5"/>

<!-- Unified processing and complete publish -->
<g class="cn"><rect x="1350" y="185" width="220" height="470" rx="23" fill="#092846" stroke="#5ad9ff" stroke-width="2.5"/><text x="1460" y="230" text-anchor="middle" class="h">加工与完整发布</text>
<rect x="1370" y="260" width="180" height="65" rx="13" fill="#0d355b"/><text x="1460" y="287" text-anchor="middle" class="tag">正文 · 来源元数据</text><text x="1460" y="312" text-anchor="middle" class="sm">页码 / 位置（如有）</text>
<text x="1460" y="357" text-anchor="middle" class="sm">去重 / 冲突检查</text><path d="M1460 370V397" fill="none" stroke="#55d9ff" stroke-width="3" marker-end="url(#a)"/>
<text x="1460" y="430" text-anchor="middle" class="b">分块 → Embedding</text><path d="M1460 445V472" fill="none" stroke="#55d9ff" stroke-width="3" marker-end="url(#a)"/>
<rect x="1360" y="480" width="200" height="95" rx="14" fill="#18244c"/><text x="1460" y="507" text-anchor="middle" class="tag">Qdrant 向量索引</text><text x="1460" y="533" text-anchor="middle" class="tag">→ MySQL chunks</text><text x="1460" y="559" text-anchor="middle" class="tag">→ OpenSearch 关键词索引</text>
<rect x="1380" y="592" width="160" height="42" rx="21" fill="#123f2d" stroke="#46da87"/><text x="1460" y="619" text-anchor="middle" class="tag" fill="#8af0b4">双索引成功 → ready</text></g>

<!-- Failure path and reliability note -->
<path d="M1460 655V706H1295" fill="none" stroke="#ffad4d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#o)"/><rect x="975" y="676" width="320" height="60" rx="20" fill="#39271d" stroke="#ffad4d"/><text x="1135" y="701" text-anchor="middle" class="cn sm" fill="#ffc46d">索引失败：Saga 补偿</text><text x="1135" y="724" text-anchor="middle" class="cn sm" fill="#ffc46d">可重试错误：延迟重试</text>
<rect x="310" y="750" width="980" height="64" rx="28" fill="#0d2b49" stroke="#285c80"/><text x="800" y="790" text-anchor="middle" class="cn" font-size="18" font-weight="750" fill="#bdeaff">采集审核是可选分支；双索引均成功后，文档才进入 ready 可检索状态</text>
</svg>
